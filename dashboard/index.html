<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MLOps Control Center</title><style>body{font-family:system-ui;background:#0b1220;color:#e5edf8;max-width:1120px;margin:35px auto;padding:16px}h1{font-size:30px}p{color:#9cb0ca}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:15px}.card{background:#18243a;padding:22px;border:1px solid #2d415d;border-radius:14px}.value{font-size:30px;font-weight:750;margin-top:12px}button{background:#16a5a0;border:0;border-radius:8px;color:#061923;padding:10px 15px;cursor:pointer}input{background:#101c2e;border:1px solid #456078;padding:10px;border-radius:8px;color:white}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #2d415d} .good{color:#5ee1b2}.alert{color:#f7aa6f}</style></head><body><h1>◈ MLOps Control Center</h1><p>Model lifecycle · Drift & quality · Read-only local monitoring</p><p>Optional API key: <input id="key" type="password" placeholder="MLOPS_API_KEY"/> <button onclick="refresh()">Refresh</button></p><div class="cards"><div class="card">Model ready<div class="value" id="ready">—</div></div><div class="card">ROC-AUC<div class="value" id="auc">—</div></div><div class="card">Drift alerts<div class="value" id="alerts">—</div></div><div class="card">Monitor events<div class="value" id="events">—</div></div></div><h2>Recent monitoring events</h2><div class="card"><table><thead><tr><th>UTC</th><th>Event</th><th>Rows</th><th>Status</th></tr></thead><tbody id="history"></tbody></table></div><p id="msg"></p><script>async function get(path){const h={};if(document.getElementById('key').value)h['X-API-Key']=document.getElementById('key').value;const r=await fetch(path,{headers:h});if(!r.ok)throw new Error(path+': HTTP '+r.status);return r.json()}async function refresh(){try{const [health,info,events]=await Promise.all([get('/health'),get('/model/info'),get('/monitor/history')]);document.getElementById('ready').textContent=health.model_ready?'YES':'NO';document.getElementById('auc').textContent=(info.roc_auc*100).toFixed(1)+'%';document.getElementById('alerts').textContent=events.filter(e=>e.alert).length;document.getElementById('events').textContent=events.length;document.getElementById('history').innerHTML=events.map(e=>'<tr><td>'+e.created_at.slice(0,19)+'</td><td>'+e.event_type+'</td><td>'+e.rows+'</td><td class="'+(e.alert?'alert':'good')+'">'+(e.alert?'DRIFT ALERT':'OK')+'</td></tr>').join('');document.getElementById('msg').textContent='Showing latest 20 events; counts are for this window, not lifetime totals.'}catch(e){document.getElementById('msg').textContent=e.message}}refresh()</script></body></html>
